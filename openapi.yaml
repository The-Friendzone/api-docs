components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token issued by `/api/v1/auth/oauth/*`, `/phone/verify`, or `/refresh`.
        Pass as `Authorization: Bearer <token>`.
    adminApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Admin endpoints accept either `x-api-key: <key>` or `Authorization: Bearer <key>`
        headers. Keys encode scopes such as `features:read`, `users:write`, or `admin:*`.
  responses:
    ErrorResponse:
      description: Error response envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    FriendId:
      name: friendId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HangoutId:
      name: hangoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeatureName:
      name: featureName
      in: path
      required: true
      schema:
        type: string
    AdminUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          default: true
        data:
          description: Endpoint-specific payload
          nullable: true
      required: [success]

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
