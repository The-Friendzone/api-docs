  /api/admin/users:
    get:
      tags:
        - Admin Users
      summary: Get paginated list of all users
      description: Retrieve a paginated list of all users with optional filtering and sorting (admin only)
      security:
        - adminApiKey: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of users per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, updatedAt, name, email]
            default: createdAt
          description: Field to sort by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - in: query
          name: isPremium
          schema:
            type: boolean
          description: Filter by premium status
        - in: query
          name: phoneVerified
          schema:
            type: boolean
          description: Filter by phone verification status
        - in: query
          name: search
          schema:
            type: string
          description: Search by name, email, or phone number (partial match)
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        phoneNumber:
                          type: string
                          nullable: true
                        phoneNumberNormalized:
                          type: string
                          nullable: true
                        phoneVerified:
                          type: boolean
                        email:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
                        profilePictureUrl:
                          type: string
                          nullable: true
                        timezone:
                          type: string
                        isPremium:
                          type: boolean
                        premiumExpiresAt:
                          type: string
                          format: date-time
                          nullable: true
                        subscriptionPlatform:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: 'limit must be between 1 and 100'
        '401':
          description: Unauthorized - Invalid or missing API key
        '403':
          description: Forbidden - Insufficient permissions

