openapi: 3.1.0
info:
  title: Friendzone API
  description: |
    HTTP API powering the Friendzone mobile app. The backend exposes OAuth/phone
    authentication, friend relationship management, hangout logging, scheduling
    utilities, push notification helpers, media uploads, subscription validation,
    and admin tooling for feature flags, API keys, users, and cron jobs.
  version: 1.0.0
servers:
  - url: https://dev.friendzoned.app
    description: Development gateway (set via deployment config)
  - url: https://api.friendzoned.app
    description: Production gateway (set via deployment config)
tags:
  - name: Health
  - name: Auth
  - name: Feature Flags
  - name: Friends
  - name: Hangouts
  - name: Settings
  - name: Calendar
  - name: Notifications
  - name: Images
  - name: Users
  - name: Subscriptions
  - name: Admin Feature Flags
  - name: Admin API Keys
  - name: Admin Users
  - name: Admin Jobs
  - name: Admin Analytics
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is responsive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/oauth/google:
    post:
      tags: [Auth]
      summary: Sign in with Google OAuth
      operationId: postAuthOAuthGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthenticateRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/oauth/apple:
    post:
      tags: [Auth]
      summary: Sign in with Apple OAuth
      operationId: postAuthOAuthApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthenticateRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/phone/send:
    post:
      tags: [Auth]
      summary: Send SMS verification code
      operationId: postAuthPhoneSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeRequest'
      responses:
        '200':
          description: Verification code dispatched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Verification code sent
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/phone/verify:
    post:
      tags: [Auth]
      summary: Verify SMS code and issue session
      operationId: postAuthPhoneVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationRequest'
      responses:
        '200':
          description: Phone verified and session issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PhoneVerificationResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange refresh token for new JWTs
      operationId: postAuthRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/features/check/{featureName}:
    get:
      tags: [Feature Flags]
      summary: Check if a user has access to a feature
      operationId: getFeatureFlagCheck
      security:
        - bearerAuth: []
      parameters:
        - name: featureName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Feature access state
          content:
            application/json:
              schema:
                type: object
                properties:
                  featureName:
                    type: string
                  hasAccess:
                    type: boolean
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/friends:
    get:
      tags: [Friends]
      summary: List friends
      description: Returns all friends with overdue data (daysOverdue and overdueScore) included
      operationId: getFriends
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pageless list of all friends for the user with overdue calculations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FriendOverdueList'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Friends]
      summary: Add friend
      operationId: postFriends
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFriendRequest'
      responses:
        '201':
          description: Friend created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          friend:
                            $ref: '#/components/schemas/Friend'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/friends/{friendId}:
    get:
      tags: [Friends]
      summary: Get friend details
      operationId: getFriendById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FriendId'
      responses:
        '200':
          description: Friend details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          friend:
                            $ref: '#/components/schemas/Friend'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Friends]
      summary: Remove friend
      operationId: deleteFriend
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FriendId'
      responses:
        '200':
          description: Friend removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
        default:
          $ref: '#/components/responses/ErrorResponse'

    patch:
      tags: [Friends]
      summary: Update friend details
      description: Update any friend fields (name, phoneNumber, targetFrequency, notes)
      operationId: patchFriend
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FriendId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFriendRequest'
      responses:
        '200':
          description: Friend updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          friend:
                            $ref: '#/components/schemas/Friend'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hangouts:
    get:
      tags: [Hangouts]
      summary: List hangout logs
      operationId: getHangouts
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: friendId
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Hangout history page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HangoutHistory'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Hangouts]
      summary: Log hangout
      operationId: postHangouts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogHangoutRequest'
      responses:
        '201':
          description: Hangout recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          hangout:
                            $ref: '#/components/schemas/HangoutLog'
                          friend:
                            $ref: '#/components/schemas/Friend'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hangouts/{hangoutId}:
    patch:
      tags: [Hangouts]
      summary: Update hangout log
      description: Update hangout log details (hangoutDate, notes, imageUrls)
      operationId: patchHangout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HangoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHangoutRequest'
      responses:
        '200':
          description: Hangout updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          hangout:
                            $ref: '#/components/schemas/HangoutLog'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Hangouts]
      summary: Delete hangout log
      description: Delete a hangout log entry
      operationId: deleteHangout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HangoutId'
      responses:
        '200':
          description: Hangout deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hangouts/stats:
    get:
      tags: [Hangouts]
      summary: Retrieve engagement stats
      operationId: getHangoutStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregated stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stats:
                            $ref: '#/components/schemas/HangoutStats'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hangouts/suggest:
    get:
      tags: [Hangouts]
      summary: List hangout requests
      description: Get all hangout requests (sent and received) with optional filters
      operationId: getHangoutsSuggest
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [sent, received]
          description: Filter by sent or received requests
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, ACCEPTED, DECLINED, CANCELLED]
          description: Filter by request status
      responses:
        '200':
          description: List of hangout requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          requests:
                            type: array
                            items:
                              $ref: '#/components/schemas/HangoutRequest'
                          total:
                            type: integer
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Hangouts]
      summary: Create hangout request
      operationId: postHangoutsSuggest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HangoutSuggestionRequest'
      responses:
        '201':
          description: Hangout request created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HangoutSuggestionResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/hangouts/suggest/{hangoutRequestId}:
    get:
      tags: [Hangouts]
      summary: Get hangout request details
      description: Get details of a specific hangout request
      operationId: getHangoutRequestById
      security:
        - bearerAuth: []
      parameters:
        - name: hangoutRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hangout request details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          request:
                            $ref: '#/components/schemas/HangoutRequest'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Hangouts]
      summary: Update hangout request
      description: Update hangout request fields (currently only status is supported)
      operationId: patchHangoutRequest
      security:
        - bearerAuth: []
      parameters:
        - name: hangoutRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HangoutRequestUpdate'
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HangoutRequestUpdateResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get user settings
      operationId: getSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserSettingsBundle'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Settings]
      summary: Update user settings
      description: |
        Update any user settings fields including timezone, notification preferences,
        and auto-prompt settings (V1 multiplayer). All fields are optional.
      operationId: patchSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                            nullable: true
                          settings:
                            $ref: '#/components/schemas/UserSettings'
                            nullable: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/calendar/connect:
    post:
      tags: [Calendar]
      summary: Connect Google Calendar
      operationId: postCalendarConnect
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Google OAuth serverAuthCode
      responses:
        '200':
          description: Calendar connected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CalendarConnectionSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/calendar/sync:
    post:
      tags: [Calendar]
      summary: Trigger calendar sync
      operationId: postCalendarSync
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarSyncRequest'
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CalendarSyncResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/calendar/availability:
    get:
      tags: [Calendar]
      summary: Compute availability windows
      operationId: getCalendarAvailability
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: minDurationMinutes
          schema:
            type: integer
            minimum: 15
            maximum: 1440
      responses:
        '200':
          description: Availability computed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AvailabilityResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/calendar/disconnect:
    delete:
      tags: [Calendar]
      summary: Disconnect calendar
      operationId: deleteCalendarConnection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          disconnected:
                            type: boolean
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/calendar/status:
    get:
      tags: [Calendar]
      summary: Inspect connection status
      operationId: getCalendarStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current connection status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CalendarStatus'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/notifications/register-device:
    post:
      tags: [Notifications]
      summary: Register push device token
      operationId: postNotificationsRegisterDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deviceToken:
                            $ref: '#/components/schemas/DeviceToken'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/notifications/history:
    get:
      tags: [Notifications]
      summary: Get notification history
      operationId: getNotificationsHistory
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: deliveryStatus
          schema:
            $ref: '#/components/schemas/NotificationDeliveryStatus'
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: History results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationHistoryResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/notifications/send-test:
    post:
      tags: [Notifications]
      summary: Send a test push notification
      operationId: postNotificationsSendTest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '200':
          description: Notification send result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SendNotificationResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: patchNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          notification:
                            $ref: '#/components/schemas/NotificationHistory'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/images/upload-url/profile:
    post:
      tags: [Images]
      summary: Generate profile upload URL
      operationId: postImagesUploadUrlProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed upload payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SignedUpload'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/images/upload-url/hangout/{hangoutId}:
    post:
      tags: [Images]
      summary: Generate hangout upload URL
      operationId: postImagesUploadUrlHangout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HangoutId'
      responses:
        '200':
          description: Signed upload payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SignedUpload'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/images/profile:
    patch:
      tags: [Images]
      summary: Persist profile picture URL
      operationId: patchImagesProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
